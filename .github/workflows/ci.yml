name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: curaloop, POSTGRES_PASSWORD: curaloop, POSTGRES_DB: curaloop }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curaloop" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: Tests on SQLite
        run: cd backend && python -m pytest -q
      - name: Tests on PostgreSQL 16
        run: cd backend && python -m pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://curaloop:curaloop@localhost:5432/curaloop" }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t curaloop .
      - name: Smoke test the container
        run: |
          docker run -d --name cl -p 8000:8000 curaloop
          for i in $(seq 1 40); do curl -sf localhost:8000/api/health && break || sleep 3; done
          curl -sf localhost:8000/api/health | grep '"status":"ok"'
          curl -sf localhost:8000/ | grep -qi "<div id=\"root\""
          docker logs cl | tail -5
