# Render Blueprint: New + > Blueprint > pick this repo. Free web service + free Postgres.
# Public demo for judges runs in demo mode (synthetic data only, role switcher visible).
services:
  - type: web
    name: curaloop
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: curaloop-db, property: connectionString }
      - key: AUTH_MODE
        value: demo
databases:
  - name: curaloop-db
    plan: free
    databaseName: curaloop
    user: curaloop
